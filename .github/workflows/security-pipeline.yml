name: DevSecOps Pipeline - VAmPI

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  security-scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Semgrep SAST
        run: |
          pip install semgrep
          semgrep scan --config auto --json -o semgrep-report.json || true

      - name: Generate Python SBOM
        run: |
          pip install cyclonedx-bom
          cyclonedx-py requirements requirements.txt -o sbom.json

      - name: Verify generated artifacts
        run: |
          echo "Verificando se os artefatos foram gerados corretamente:"
          ls -la | grep -E "semgrep-report.json|sbom.json"

      - name: Import SAST results to DefectDojo
        env:
          DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
          DEFECTDOJO_API_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}
        run: |
          curl -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_API_KEY }}" \
            -F "scan_type=Semgrep JSON Report" \
            -F "file=@semgrep-report.json" \
            -F "engagement=19" \
            -F "active=true" \
            -F "verified=true"

      - name: Upload SBOM to Dependency-Track
        env:
          DT_URL: ${{ secrets.DEPENDENCY_TRACK_URL }}
          DT_API_KEY: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
          DT_PROJECT_ID: ${{ secrets.DEPENDENCY_TRACK_PROJECT_ID }}
        run: |
          curl -X PUT "${{ env.DT_URL }}/api/v1/bom" \
            -H "Content-Type: application/json" \
            -H "X-Api-Key: ${{ env.DT_API_KEY }}" \
            -d "{\"project\": \"${{ env.DT_PROJECT_ID }}\", \"bom\": \"$(base64 -w 0 sbom.json)\"}"